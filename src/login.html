<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --panel: #13131a;
      --border: #2a2a3a;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --input-bg: #1a1a24;
      --error: #ff4d6d;
      --success: #43e97b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: blobMove 8s ease-in-out infinite alternate;
    }
    .blob-1 { width: 420px; height: 420px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -60px; animation-delay: 3s; }
    .blob-3 { width: 200px; height: 200px; background: #43e97b; top: 50%; left: 60%; animation-delay: 1.5s; }

    @keyframes blobMove {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 20px) scale(1.08); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.08);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo / Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    /* Form */
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.4;
      pointer-events: none;
    }
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      padding: 13px 14px 13px 42px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(255,77,109,0.12);
    }
    input::placeholder { color: var(--muted); }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      display: flex;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: var(--text); }

    .field-error {
      font-size: 12px;
      color: var(--error);
      margin-top: 6px;
      display: none;
      align-items: center;
      gap: 4px;
    }
    .field-error.show { display: flex; }

    /* Options row */
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      margin-top: -4px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .remember input[type=checkbox] {
      width: 16px; height: 16px;
      padding: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .forgot {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .forgot:hover { opacity: 0.7; }

    /* Button */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
      position: relative;
      overflow: hidden;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(108,99,255,0.5); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Global error message */
    .global-error {
      background: rgba(255,77,109,0.1);
      border: 1px solid rgba(255,77,109,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .global-error.show { display: flex; }

    /* Success message */
    .global-success {
      background: rgba(67,233,123,0.1);
      border: 1px solid rgba(67,233,123,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--success);
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .global-success.show { display: flex; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 24px;
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="card">
  <div class="brand">
    <div class="brand-icon">✦</div>
    <span class="brand-name">practiqueñas</span>
  </div>

  <h1>Bienvenido</h1>
  <p class="subtitle">Inicia sesión para continuar</p>

  <div class="global-error" id="globalError">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="globalErrorMsg"></span>
  </div>

  <div class="global-success" id="globalSuccess">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    <span>¡Login exitoso! Redirigiendo...</span>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <div class="input-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input type="email" id="email" placeholder="tu@email.com" autocomplete="email"/>
      </div>
      <div class="field-error" id="emailError">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span></span>
      </div>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
          <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="field-error" id="passwordError">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span></span>
      </div>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox" id="remember"/> Recordarme
      </label>
      <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="submit" class="btn" id="submitBtn">
      <span class="btn-text">Iniciar sesión</span>
      <div class="spinner"></div>
    </button>
  </form>

  <div class="footer">
    ¿No tienes cuenta? <a href="register.html">Regístrate</a>
  </div>
</div>

<script>
  // Toggle password visibility
  const togglePass = document.getElementById('togglePass');
  const passInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  
  togglePass.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    eyeIcon.innerHTML = isPass
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  // Validation helpers
  function showFieldError(fieldId, errorId, msg) {
    document.getElementById(fieldId).classList.add('error');
    const err = document.getElementById(errorId);
    err.querySelector('span').textContent = msg;
    err.classList.add('show');
  }
  function clearFieldError(fieldId, errorId) {
    document.getElementById(fieldId).classList.remove('error');
    document.getElementById(errorId).classList.remove('show');
  }
  function showGlobalError(msg) {
    document.getElementById('globalErrorMsg').textContent = msg;
    document.getElementById('globalError').classList.add('show');
    document.getElementById('globalSuccess').classList.remove('show');
  }
  function clearGlobalError() {
    document.getElementById('globalError').classList.remove('show');
  }

  // Real-time validation
  document.getElementById('email').addEventListener('input', function() {
    if (this.value) clearFieldError('email', 'emailError');
  });
  document.getElementById('password').addEventListener('input', function() {
    if (this.value) clearFieldError('password', 'passwordError');
  });

  // Form submit
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    clearGlobalError();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');

    let valid = true;

    // Validate email
    if (!email) {
      showFieldError('email', 'emailError', 'El correo es obligatorio');
      valid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showFieldError('email', 'emailError', 'Ingresa un correo válido');
      valid = false;
    } else {
      clearFieldError('email', 'emailError');
    }

    // Validate password
    if (!password) {
      showFieldError('password', 'passwordError', 'La contraseña es obligatoria');
      valid = false;
    } else if (password.length < 6) {
      showFieldError('password', 'passwordError', 'Mínimo 6 caracteres');
      valid = false;
    } else {
      clearFieldError('password', 'passwordError');
    }

    if (!valid) return;

    // Loading state
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      // Llamada al backend PHP
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok && data.token) {
        // Guardar token
        const storage = document.getElementById('remember').checked ? localStorage : sessionStorage;
        storage.setItem('token', data.token);
        storage.setItem('user', JSON.stringify(data.user));

        // Mostrar éxito y redirigir
        document.getElementById('globalSuccess').classList.add('show');
        setTimeout(() => { window.location.href = '/index.html'; }, 1500);
      } else {
        showGlobalError(data.message || 'Credenciales incorrectas');
      }
    } catch (err) {
      showGlobalError('Error de conexión. Intenta de nuevo.');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
